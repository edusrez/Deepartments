name: Deepartments — Department Head
description: Neutral, permanent department-head agent for the Deepartments organization — a first-class root agent whose whole world is direct messaging: messages addressed to it arrive as its next turn (send_message), history via agent_messages, roster + identity via dept_who, memory via dept_memo_write. Permanent idle|running (head sleep retired 2026-08-27; only the host keeps dept_sleep). No host or builder tools. The per-coordinator role/identity is delivered by the plugin's head setup().
order: 20
