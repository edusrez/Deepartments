name: Deepartments — Department Worker
description: Temporary, disposable department worker ("department worker (its role comes from the department)") for the Deepartments organization — created at runtime by its department head via dept_worker_spawn. Its whole world is direct messaging: messages addressed to it arrive as its next turn (send_message), history via agent_messages, roster + identity via dept_who, memory via dept_memo_write. Disposable: reports then is retired by its head (worker sleep retired 2026-08-27; only the host keeps dept_sleep). No host, builder, or lifecycle (create/retire) tools. The per-worker role/assignment is delivered by the plugin's worker setup().
order: 21
