name: Deepartments — Department Worker
description: Temporary, disposable department worker ("rank-and-file researcher") for the Deepartments organization — created at runtime by its department head via dept_post_create. Its whole world is direct messaging: messages addressed to it arrive as its next turn (send_message), history via agent_messages, roster + identity via dept_who, memory/sleep via dept_memo_write/dept_sleep. No host, builder, or lifecycle (create/retire) tools. The per-worker role/assignment is delivered by the plugin's worker setup().
order: 21
