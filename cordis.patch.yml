# dsh-deepartments configuration layer — top-level YAML array of patch entries.
# The row references the package by NAME (bundles → profile → $DSH_HOME → --patch, last wins per row).
- insert:
    - id: deepartments
      name: dsh-deepartments
      config:
        stateDir: .deepartments
        # The static organization architecture (owner decisions 11-12; spec 003
        # B3 cutover): the org is an AGENTS CATALOG — the host plus the
        # departments, each headed by a coordinator (research-head heads the
        # research department). Rooms were removed; agents message each other
        # directly via send_message. Departments are defined HERE, never
        # created by agents.
        # workspacePath (optional, F5): the department's OWN sidebar workspace.
        # The plugin autogenerates it at runtime — mkdir -p the directory, then
        # registers it (idempotent workspaceRegistry.create, title = the
        # department name) — and the department's head/worker sessions are born
        # with cwd there, so they group under a "Research Department" folder in
        # the sidebar. A department WITHOUT workspacePath keeps the shared
        # workspace root (pre-F1 behavior, zero regression).
        # agentOptions values: models served via the opencode-zen provider
        # (OpenCode Go (Zen), https://opencode.ai/zen/go/v1, apiKeyEnv
        # OPENCODE_GO_API_KEY — configured in settings.yaml of the profile);
        # deepseek-v4-flash-vision-exp with reasoning max (same as the Asistente).
        org:
          # D-Q6 fs-scope (spec 007 §3.2/§5.3; seam-report risk 3): the
          # quality-inspector's archived-session reads — the stateDir
          # journals/* (under config.stateDir, itself a dept_exec allowed root)
          # AND the session-persistence root + host-rotation evidence archive
          # (sessions/*.jsonl.zstd + archive/, both under /opt/dsh/.dsh-dev —
          # sessionPersistence.root, itself a dept_exec DEFAULT root). Both are
          # ALREADY reachable by dept_exec, so org.execRoots needs NO extension
          # for the D-Q6 inspect read access.
          departments:
            - id: research
              name: Research Department
              workspacePath: /root/.deepartments/departments/research
              coordinator:
                postId: research-head
                title: Head of Research
                role: Research department head
                sessionTitle: Research Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
            - id: internal-programming
              name: Internal Programming
              workspacePath: /root/.deepartments/departments/internal-programming
              coordinator:
                postId: internal-programming-head
                title: Internal Programming Head
                role: Internal Programming department head
                sessionTitle: Internal Programming Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
            - id: quality
              name: Quality Department
              workspacePath: /root/.deepartments/departments/quality
              coordinator:
                postId: quality-head
                title: Quality Head
                role: Quality department head
                sessionTitle: Quality Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
          # P1 rewire-pooler: the pooler (dsh-key-pooler) baseURL — a LEGITIMATE
          # local/proxy LLM route. The endpoint-drift exemption
          # (providerAdapterEndpointDrift in src/invoke.ts) treats a baseURL
          # EXACTLY equal to this as a HEALTHY route (NOT drift), so the boot
          # provider-adapter check does NOT false-alert on the pooler. MUST match
          # the opencode-zen baseURL set in settings.yaml
          # (llm-pi-ai.providers.opencode-zen.baseURL). Absent/undefined → NO
          # exemption (every local/proxy baseURL stays a drift).
          poolerBaseURL: http://127.0.0.1:4097/v1
        # Quality Department runtime block (D-Q2, spec 007 §4.1): the worker-
        # archive inspection dice probability. CODE-DEFAULT-CAPABLE — ABSENT →
        # the code default 0.10; present → that value (the D-Q3 head/host 100%
        # inspect mandate is structural and NOT a knob).
        # P3 (owner decision 2026-08-25 "sube la posibilidad al 25%"): the PERMANENT
        # repo value is 0.25 (25% of worker retirements audited). Code default stays
        # 0.10 (a config with NO quality block still composes at the code default).
        # ENV-VAR ALIGNMENT (dec5, C10): `DEEPARTMENTS_QUALITY_INSPECT` (a numeric
        # [0,1] string, spec 007 §4.1) is the SINGLE DOCUMENTED override of this
        # dice probability — config == env. When set and valid it WINS over this
        # value in the probability path ONLY (the QH dice + the worker dice); the
        # structural NON-QH head/host 100% inspect mandate is never overridden (it
        # is not a dice). Absent/invalid env → this config value (0.25); no quality
        # block at all → the code default 0.10 (QUALITY_WORKER_INSPECT_DEFAULT_PROBABILITY,
        # src/invoke.ts). Priority: env > config > code default. The
        # quality-inspect.conf drop-in keeps the SAME 0.25 (coherent, C16).
        quality:
          workerInspectProbability: 0.25

# HOST-SIDE FIRST-WAKE FIX (owner-owned bundle patch — "bundles → profile →
# $DSH_HOME → --patch, last wins per row"). These top-level rows OVERRIDE the
# CORE deployment defaults by id so the default deployment persona NEVER
# references the model variable (unbound at the first post-restart wake, when
# the async model-selection/settings source is not yet loaded) and the host's
# agent.options.model/provider are never empty early. See
# reports/explore-deep/2026-08-24-firstwake-assembly-roots.md.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the deepseek-v4-flash-vision-exp model. Your working directory is {{cwd}}.
- id: agent-default-model
  config:
    provider: opencode-zen
    model: deepseek-v4-flash-vision-exp
