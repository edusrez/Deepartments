# dsh-deepartments configuration layer — top-level YAML array of patch entries.
# The row references the package by NAME (bundles → profile → $DSH_HOME → --patch, last wins per row).
- insert:
    - id: deepartments
      name: dsh-deepartments
      config:
        stateDir: .deepartments
        # The static organization architecture (owner decisions 11-12): rooms
        # are program architecture defined HERE, never created by agents.
        # The board room is the coordination room; research-head is a member
        # of BOTH the board room and the research department room.
        # agentOptions values verified: models served via the opencode-go-responses provider (registered by @deepseek-ai/dsh-llm-pi-ai; Responses API); muse-spark-1.2-contributor available under it (reasoningEffort xhigh set globally in settings.yaml — not repeated per head here).
        org:
          rooms:
            - id: board
              name: Board of directors
              purpose: Coordination room of department heads
              members:
                - asistente
                - research-head
                - programming-head
            - id: research
              name: Research department
              purpose: Research department room
              members:
                - research-head
            - id: programming
              name: Internal Programming department
              purpose: Internal Programming department room
              members:
                - programming-head
          departments:
            - id: research
              name: Research Department
              roomId: research
              coordinator:
                postId: research-head
                title: Head of Research
                role: Research department head
                provider: opencode-go-responses
                agentOptions:
                  provider: opencode-go-responses
                  model: muse-spark-1.2-contributor
            - id: programming
              name: Internal Programming Department
              roomId: programming
              coordinator:
                postId: programming-head
                title: Head of Internal Programming
                role: Internal Programming department head
                provider: opencode-go-responses
                agentOptions:
                  provider: opencode-go-responses
                  model: muse-spark-1.2-contributor
        # Custom ctx.web fetch provider (webfetch.ts): detects blocking
        # (403/429) and reports WEB_BLOCKED with a message that instructs
        # API/JSON-endpoint investigation instead of guessing host endpoints.
        # Plain scalars only — no !!js outside the runtime config engine.
        webfetch:
          enabled: true
          # userAgent and accept default to the bundle's honest product UA and
          # a JSON-preferring Accept; uncomment to override.
          # userAgent: deepartments/0.1.0 (DeepSeek Harness plugin; +https://github.com/esuarez/deepartments)
          # accept: application/vnd.github.raw+json, application/json;q=0.9, text/markdown;q=0.8, text/html;q=0.5
          maxUrlLength: 2048
          timeoutMs: 30000
          maxResponseBytes: 5000000
          maxRedirects: 5
