# dshd-webfetch configuration layer — top-level YAML array of patch entries.
# Registers the custom `ctx.web` fetch provider (blocking detection 403/429 +
# WEB_BLOCKED investigation message). Plain scalars only — no !!js outside the
# runtime config engine.
- insert:
    - id: dshd-webfetch
      name: dshd-webfetch
      config:
        enabled: true
        # userAgent and accept default to the provider's honest product UA and
        # a JSON-preferring Accept; uncomment to override.
        # userAgent: deepartments/0.1.0 (DeepSeek Harness plugin; +https://github.com/esuarez/deepartments)
        # accept: application/vnd.github.raw+json, application/json;q=0.9, text/markdown;q=0.8, text/html;q=0.5
        maxUrlLength: 2048
        timeoutMs: 30000
        maxResponseBytes: 5000000
        maxRedirects: 5
# LANE 0.2.3c (P7b — TOTAL MODULARITY cierre): the fetchProvider SELECTION now
# lives in THIS package as the DEFAULT — mounting dshd-webfetch IS the complete
# web-fetch feature (provider registered AND selected), no profile pin needed.
# The seam resolves `fetchProvider` from the composed `web` row's config
# (@deepseek-ai/dsh-web lib/index.js: `config.fetchProvider ?? $DSH_WEB_FETCH_PROVIDER`).
# A patch row REPLACES the targeted row's WHOLE config (no merge — the same
# discipline the dev profile documents), so the base `searchProvider`
# (@deepseek-ai/dsh-base web row) is restated here to stay behavior-neutral in
# minimal compositions. The dev profile MAY keep its own `web` row: the profile
# layer composes AFTER the bundle layers (composeProfile last-write-wins), so a
# profile row still OVERRIDES this default — the local override seam is
# preserved (evidence: profile-boot composeProfile order + lane023c report).
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: deepartments-fetch
