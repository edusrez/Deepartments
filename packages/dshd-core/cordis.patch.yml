# dshd-core configuration layer — top-level YAML array of patch entries.
# FASE 2.5 BATCH A (scaffold) → B (services plugin): dshd-core is now a real
# Cordis PLUGIN (name/inject/apply in lib/index.js) that registers the core
# SERVICES for the dsh-deepartments bundle to consume via ctx.get. The plugin
# row below registers dshd-core with its core config (stateDir + the org
# mirror + core constants) so it composes.
# FASE 2.6 BATCH A (config relocation) + D5 (modularization, 2026-08-29): the
# org configuration (departments, execRoots, missionExecRoots, poolerBaseURL)
# + stateDir are declared HERE — dshd-core is the SHARED CONFIG SOURCE. The
# bundle (dsh-deepartments) consumes them via `ctx.get('deepartments.org')`
# (falling back to its own patch row in minimal/hermetic compositions), and
# dshd-core builds its ACL lens from its OWN `org.departments` mirror.
# D5 SINGLE-SOURCE-OF-TRUTH CONTRACT (R6 behavior-neutral): the dshd-core row
# is the ONE source of truth for the org fallback — the bundle's own
# `deepartments` row (root cordis.patch.yml) is its MIRROR for minimal/
# hermetic compositions and MUST stay on the shared keys (`stateDir`,
# `org.departments`, `org.poolerBaseURL`); test/org-config-parity.test.js
# locks the mirror (parity = test failure, never silent drift). One-sided
# keys are INTENTIONAL and NOT mirrored: `org.postsRetention` lives ONLY here
# (core row — the bundle's fallback leaves it absent so hermetic pruning stays
# OFF); `org.pacing` + `quality` live ONLY in the bundle row (they are
# bundle-side knobs with code defaults — the core row never carries them).
# NOTE: the CLI composes ONLY the
# `dsh.profile.bundles` layers (in order); being a `dependencies` of
# dsh-deepartments does NOT add a bundle layer. D5 (modularization,
# 2026-08-29): dshd-core IS composed today — the dev profiles
# (deepartments-dev / deepartments-dev-headless) carry dshd-core in
# `dsh.profile.bundles` IMMEDIATELY BEFORE dsh-deepartments (compose-first,
# Asistente checkpoint), exactly as this note previously prescribed;
# `--dump-config` shows `# == dshd-core` before `# == dsh-deepartments`.
# A minimal/hermetic composition WITHOUT dshd-core still loads the bundle
# (the in-bundle fallback keeps working, R6).
# Plain scalars only — no !!js outside the runtime config engine.
- insert:
    - id: dshd-core
      name: dshd-core
      config:
        # The org stateDir — MUST match dsh-deepartments' config.stateDir so the
        # catalog the bundle consumes points at the SAME posts.json/hosts.json.
        # FASE 2.6 BATCH A: stateDir is relocated HERE (the dshd-core row), the
        # shared config source. The bundle reads it via `deepartments.org`.
        stateDir: .deepartments
        # The static organization architecture (FASE 2.6 BATCH A relocation —
        # moved from the bundle's `deepartments` row to dshd-core's row): the
        # org is an AGENTS CATALOG — the host plus the departments, each headed
        # by a coordinator. Departments are defined HERE, never created by
        # agents. This is the SHARED config source the bundle consumes via
        # `ctx.get('deepartments.org')` (with an in-bundle fallback for minimal
        # compositions), and dshd-core builds its ACL lens from this mirror.
        org:
          departments:
            - id: research
              name: Research Department
              workspacePath: /root/.deepartments/departments/research
              # E2 — DIRECTORIO de departamentos (wake-pack section 5b + skill
              # mirror): purpose = WHAT the department does; services = HOW to
              # request it (the REQUEST format + send_message target). The pack
              # section is assembled FROM these config fields — never hardcoded.
              purpose: >-
                investigación web-first de la org — evidencia
                actual/community/security (research-on-demand + tech-watch
                biweekly; roles researcher/analyst/reviewer/organizer)
              services: >-
                RESEARCH REQUEST (send_message a research-head) — devuelve
                informe + resumen 3-5 bullets
              coordinator:
                postId: research-head
                title: Head of Research
                role: Research department head
                sessionTitle: Research Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
            - id: internal-programming
              name: Internal Programming
              workspacePath: /root/.deepartments/departments/internal-programming
              # E2 — dirección: PROGRAMMING REQUEST + DAG/cola IPD (builder /
              # reviewer / explore-deep / organizer).
              purpose: >-
                todo el trabajo de código interno de DSH/dsh-deepartments/
                plugins — planificación, implementación (builder), análisis
                profundo (explore-deep), revisión (reviewer), jobs semanales
                (weekly-repo-health, version-watch); DAG/cola IPD
              services: PROGRAMMING REQUEST (send_message a internal-programming-head)
              coordinator:
                postId: internal-programming-head
                title: Internal Programming Head
                role: Internal Programming department head
                sessionTitle: Internal Programming Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
            - id: quality
              name: Quality Department
              workspacePath: /root/.deepartments/departments/quality
              # E2 — dirección: QUALITY REQUEST/feedback; report-only (los fixes
              # van al IPD vía PROGRAMMING REQUEST).
              purpose: >-
                inspecciona el runtime de la propia org (eventos de archivo
                25%/100%, post-errors, digest diario quality-daily); SOLO
                reporta, nunca arregla (los fixes van al IPD vía PROGRAMMING
                REQUEST)
              services: QUALITY REQUEST (send_message a quality-head)
              coordinator:
                postId: quality-head
                title: Quality Head
                role: Quality department head
                sessionTitle: Quality Head
                provider: opencode-zen
                agentOptions:
                  provider: opencode-zen
                  model: deepseek-v4-flash
                  reasoningEffort: max
          # Posts retention (A3/C2): keep the 50 newest RETIRED entries in
          # posts.json; archive older ones to posts-retired-archive.jsonl
          # (non-destructive) — owner-approved.
          postsRetention:
            maxRetiredKept: 50
            archiveFile: posts-retired-archive.jsonl
            enabled: true
          # P1 rewire-pooler: the pooler (dsh-key-pooler) baseURL — a LEGITIMATE
          # local/proxy LLM route. The endpoint-drift exemption treats a baseURL
          # EXACTLY equal to this as a HEALTHY route (NOT drift). MUST match the
          # opencode-zen baseURL set in settings.yaml.
          poolerBaseURL: http://127.0.0.1:4097/v1
          # R4 (providers → org config, LANE 0.2.3): the DEFAULT worker/host
          # model route — declared in the org (single source), resolved
          # org-driven in dshd-orchestration presets.ts (literals as code
          # fallback). deepseek-v4-flash = the RUNTIME TRUTH (verified via the
          # dev --dump-config: the host agent-default-model + persona + the
          # coordinator rows all run flash; the pre-R4 HOST literal vision-exp
          # was stale). MUST mirror packages/dshd-core-min/cordis.patch.yml
          # (org-config-parity locks the equality).
          workerAgentOptions:
            provider: opencode-zen
            model: deepseek-v4-flash
            reasoningEffort: max
          hostAgentOptions:
            provider: opencode-zen
            model: deepseek-v4-flash
            reasoningEffort: max
        # core constants (configurable, code-defaulted): the catalog is the
        # single source; no daemons / role registry here (single source stays the
        # bundle's role-orient.ts).
